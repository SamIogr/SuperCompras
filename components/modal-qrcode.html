<!-- MODAL DE COMPARTILHAMENTO E LEITURA DE QR CODE -->
<div id="modalQRCodeSync" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-xs">
  <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-4 sm:p-5 border border-slate-200 flex flex-col relative text-center">
    
    <!-- Cabeçalho -->
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div class="text-left">
        <h3 class="font-black text-slate-800 text-base">QR Code da Lista</h3>
        <p class="text-[11px] text-slate-400 font-semibold">Transfira a lista entre celulares</p>
      </div>
      <button type="button" onclick="fecharModalQRCode()" class="p-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 transition-colors cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Alternador Compartilhar / Escanear -->
    <div class="bg-slate-100 p-1 rounded-2xl flex items-center gap-1 my-3 border border-slate-200">
      <button type="button" id="qrTabBtnGerar" onclick="alternarAbaModalQR('gerar')" class="flex-1 py-1.5 rounded-xl bg-white text-slate-800 shadow-xs font-bold text-xs transition-all cursor-pointer">
        Compartilhar
      </button>
      <button type="button" id="qrTabBtnLer" onclick="alternarAbaModalQR('ler')" class="flex-1 py-1.5 rounded-xl text-slate-500 font-semibold text-xs transition-all cursor-pointer">
        Escanear
      </button>
    </div>

    <!-- Painel 1: Gerar e Mostrar QR Code -->
    <div id="qrPainelGerar" class="space-y-3 py-2">
      <div id="qrCodeCanvasContainer" class="flex items-center justify-center min-h-[230px] p-2 bg-slate-50 rounded-2xl border border-slate-100"></div>
      <div id="qrAvisoCarrinhoVazio" class="hidden py-8 text-center text-slate-400">
        <p class="text-xs font-bold text-slate-600">O carrinho está vazio.</p>
        <p class="text-[11px] mt-1">Adicione itens para gerar o QR Code.</p>
      </div>
      <p class="text-[11px] text-slate-400 leading-tight">
        Abra o SuperCompras no outro celular e selecione a aba <strong>Escanear</strong> para ler os itens.
      </p>
    </div>

    <!-- Painel 2: Escanear com Câmera ou Imagem -->
    <div id="qrPainelLer" class="hidden space-y-3 py-1">
      <div class="relative w-full aspect-square bg-slate-900 rounded-2xl overflow-hidden border border-slate-200 flex items-center justify-center">
        <video id="qrScannerVideo" class="w-full h-full object-cover" playsinline></video>
        <div class="absolute inset-0 border-2 border-emerald-500/60 rounded-2xl pointer-events-none m-6"></div>
      </div>
      <p id="qrScannerStatus" class="text-[11px] font-bold text-slate-500">Aguardando câmera...</p>
      
      <div class="pt-2 border-t border-slate-100">
        <label class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-all cursor-pointer flex items-center justify-center space-x-2">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span>Carregar Foto com QR Code</span>
          <input type="file" accept="image/*" class="hidden" onchange="lerQRCodeDeArquivo(this)" />
        </label>
      </div>
    </div>

  </div>
</div>
</body>
