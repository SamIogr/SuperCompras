
<!-- MODAL DE EDIÇÃO DO ITEM NO CARRINHO -->
<div id="modalEditCartItem" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3">
  <div class="bg-white rounded-3xl w-full max-w-md p-5 shadow-2xl relative max-h-[92vh] overflow-y-auto">
    <input type="hidden" id="editCartItemId">

    <!-- Cabeçalho -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
      <div>
        <h3 class="text-base font-black text-slate-800">Editar Item do Carrinho</h3>
        <span id="editCartItemHeaderPrice" class="text-xs font-bold text-emerald-600"></span>
      </div>
      <button type="button" onclick="closeEditCartItemModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold p-1">✕</button>
    </div>

    <form id="formSaveCartItemEdit" onsubmit="event.preventDefault(); salvarEdicaoItemCarrinho();" class="mt-4 space-y-4">
      
      <!-- Nome do Produto Editável -->
      <div>
        <label class="block text-xs font-black text-slate-700 mb-1">Nome do Produto *</label>
        <input type="text" id="editCartItemName" required placeholder="Nome do produto..."
          class="w-full text-xs font-bold text-slate-800 bg-white border border-slate-300 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-xs" />
      </div>

      <!-- Seletor de Marca com Gestão Integrada -->
      <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3">
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-black text-slate-700 flex items-center space-x-1">
            <span>🏷️ Marca do Produto</span>
          </label>
        </div>
      
        <div id="boxEditMarcaSelect">
          <select id="editCartItemBrand"
            class="w-full text-xs font-bold text-emerald-800 bg-white border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-xs">
            <option value="Padrão">🏷️ Padrão</option>
          </select>
        </div>
      
        <div id="boxEditMarcaInline" class="hidden flex items-center space-x-1.5 mt-2">
          <input type="text" id="inputEditNovaMarca" placeholder="Nome da marca..."
            class="flex-1 text-xs font-bold bg-white border border-slate-300 rounded-xl px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <button type="button" onclick="confirmarNovaMarcaModalEdicao()"
            class="px-2.5 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold active:scale-95 shadow-xs">✓</button>
          <button type="button" onclick="cancelarNovaMarcaModalEdicao()"
            class="px-2.5 py-1.5 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold active:scale-95 shadow-xs">✕</button>
        </div>
      </div>
      
      <!-- Preço e Quantidade Diretos -->
      <div class="grid grid-cols-2 gap-3 mt-3">
        <div>
          <label class="block text-xs font-black text-slate-700 mb-1">Preço Unit. (R$) *</label>
          <input type="text" id="editCartItemPrice" inputmode="decimal" oninput="atualizarSubtotalModalEdicao()"
            class="w-full text-xs font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-xs">
        </div>
        <div>
          <label class="block text-xs font-black text-slate-700 mb-1">Qtd. / Peso *</label>
          <input type="number" id="editCartItemQty" step="any" min="0.001" oninput="atualizarSubtotalModalEdicao()"
            class="w-full text-xs font-bold text-slate-800 bg-white border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-xs">
        </div>
      </div>

      <!-- Atalhos de Quantidade -->
      <div class="flex items-center space-x-1 overflow-x-auto pb-1 text-xs font-bold">
        <span class="text-[10px] text-slate-400 font-extrabold mr-1">Atalhos:</span>
        <button type="button" onclick="setEditQty(1)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700">1</button>
        <button type="button" onclick="setEditQty(2)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700">2</button>
        <button type="button" onclick="setEditQty(3)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700">3</button>
        <button type="button" onclick="setEditQty(0.25)" class="px-2 py-1 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg">250g</button>
        <button type="button" onclick="setEditQty(0.5)" class="px-2 py-1 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg">500g</button>
        <button type="button" onclick="setEditQty(1)" class="px-2 py-1 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg">1 kg</button>
      </div>

      <!-- Condição Comercial -->
      <div class="mt-4 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <span class="block text-xs font-bold text-slate-700 mb-2">Condição Comercial</span>
      
        <!-- Seletor de Tipo (Botões / Tabs) com chamadas diretas -->
        <div class="grid grid-cols-3 gap-1 bg-slate-200/70 p-1 rounded-lg text-xs font-semibold" id="editCartItemConditionTabs">
          <button type="button" id="btnEditPromoNone" onclick="setEditPromoType('none')"
            class="py-1.5 rounded-md transition-all font-bold">Nenhum</button>
          <button type="button" id="btnEditPromoDiscount" onclick="setEditPromoType('discount')"
            class="py-1.5 rounded-md transition-all font-bold">Desconto</button>
          <button type="button" id="btnEditPromoWholesale" onclick="setEditPromoType('wholesale')"
            class="py-1.5 rounded-md transition-all font-bold">Atacado</button>
        </div>
      
        <!-- Bloco: Desconto -->
        <div id="panelEditPromoDiscount" class="hidden mt-3 pt-3 border-t border-slate-200 space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label for="editPromoDiscountMode" class="text-[10px] font-bold text-slate-500 block">Tipo</label>
              <select id="editPromoDiscountMode" onchange="atualizarSubtotalModalEdicao()"
                class="mt-1 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-xs bg-white font-bold">
                <option value="percent">Porcentagem (%)</option>
                <option value="fixed">Valor Fixo (R$)</option>
              </select>
            </div>
            <div>
              <label for="editPromoDiscountValue" class="text-[10px] font-bold text-slate-500 block">Desconto</label>
              <input type="number" id="editPromoDiscountValue" step="any" min="0" placeholder="0" oninput="atualizarSubtotalModalEdicao()"
                class="mt-1 w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-sm font-bold bg-white" />
            </div>
          </div>
        </div>
      
        <!-- Bloco: Atacado -->
        <div id="panelEditPromoWholesale" class="hidden mt-3 pt-3 border-t border-slate-200 space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label for="editPromoWholesaleMinQty" class="text-[10px] font-bold text-slate-500 block">A partir de (Qtd/Kg):</label>
              <input type="number" id="editPromoWholesaleMinQty" step="any" min="0" placeholder="3" oninput="atualizarSubtotalModalEdicao()"
                class="mt-1 w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-sm font-bold bg-white" />
            </div>
            <div>
              <label for="editPromoWholesalePrice" class="text-[10px] font-bold text-slate-500 block">Preço Atacado (R$):</label>
              <input type="text" id="editPromoWholesalePrice" inputmode="decimal" placeholder="0,00" oninput="atualizarSubtotalModalEdicao()"
                class="mt-1 w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-sm font-bold bg-white" />
            </div>
          </div>
        </div>
      </div>
      
      <!-- Rodapé com Subtotal e Botão Salvar -->
      <div class="mt-4 pt-3 border-t border-slate-200 flex items-center justify-between">
        <div>
          <span class="block text-[11px] text-slate-500">Novo Subtotal</span>
          <strong id="editCartItemSubtotal" class="text-lg font-bold text-emerald-600">R$ 0,00</strong>
        </div>
        <button type="submit" id="btnSaveCartItemEdit"
          class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-bold hover:bg-emerald-700 active:scale-95 transition-all shadow-sm cursor-pointer">
          Salvar
        </button>
      </div>
    </form>
  </div>
  </body>
