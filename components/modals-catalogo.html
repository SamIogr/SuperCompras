<!-- MODAL UNIFICADO: CADASTRAR / EDITAR PRODUTO, MARCAS E COTAÇÕES -->
<div id="modalProductEdit" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-sm">
  <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-4 sm:p-5 space-y-4 max-h-[92vh] overflow-y-auto">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 id="modalProductEditTitle" class="font-extrabold text-slate-800 text-base">Produto</h3>
      <button type="button" onclick="closeProductEditModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold leading-none">✕</button>
    </div>

    <form id="formSaveProductCatalog" class="space-y-3">
      <input type="hidden" id="editProdId" value="" />
      
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1" for="editProdName">Nome do Produto <span class="text-rose-500">*</span></label>
        <input type="text" id="editProdName" required placeholder="Ex: Acém, Sassami, Feijão..." class="w-full text-xs font-semibold py-2.5 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none" />
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1" for="editProdCategory">Categoria</label>
          <select id="editProdCategory" class="w-full text-xs font-semibold py-2.5 px-2 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="Açougue e Carnes">Açougue e Carnes</option>
            <option value="Laticínios e Frios">Laticínios e Frios</option>
            <option value="Mercearia e Básicos">Mercearia e Básicos</option>
            <option value="Hortifrúti e Ovos">Hortifrúti e Ovos</option>
            <option value="Higiene e Limpeza">Higiene e Limpeza</option>
            <option value="Geral">Geral</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1" for="editProdUnit">Unidade Padrão</label>
          <select id="editProdUnit" class="w-full text-xs font-semibold py-2.5 px-2 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="kg">kg (Quilo)</option>
            <option value="un">un (Unidade)</option>
            <option value="cx">cx (Caixa)</option>
            <option value="pct">pct (Pacote)</option>
            <option value="pt">pt (Pote)</option>
            <option value="lt">lt (Lata)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1" for="editProdBasePrice">Preço Base de Referência (R$) (Opcional)</label>
        <input type="text" id="editProdBasePrice" inputmode="decimal" placeholder="0,00" class="w-full text-xs font-bold py-2.5 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none" />
      </div>

      <div id="containerPrecosMarcasEdit" class="hidden border-t border-slate-200/80 pt-3 space-y-3">
        
        <div class="bg-emerald-50/60 border border-emerald-200 rounded-xl p-3 space-y-2.5">
          <div class="flex items-center justify-between">
            <label class="text-xs font-black text-slate-700 flex items-center space-x-1">
              <span>🏷️ Marca Ativa:</span>
            </label>
            <div id="boxCatalogMarcaActions" class="hidden flex items-center space-x-1">
              <button type="button" onclick="iniciarEdicaoNomeMarcaCatalogo()" class="p-1 text-slate-400 hover:text-emerald-700 hover:bg-emerald-50 rounded-lg transition-colors" title="Renomear marca">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
              </button>
              <button type="button" onclick="confirmarExclusaoMarcaCatalogo()" class="p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="Excluir marca">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          </div>

          <div id="boxCatalogMarcaSelect">
            <select id="compareSelectBrand" onchange="onCompareBrandChanged(this.value)" class="w-full text-xs font-bold text-emerald-800 bg-white border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-xs">
              <option value="Padrão">🏷️ Padrão</option>
            </select>
          </div>

          <div id="boxCatalogMarcaInline" class="hidden flex items-center space-x-1.5">
            <input type="text" id="inputCatalogNovaMarca" placeholder="Nome da marca..." class="flex-1 text-xs font-bold bg-white border border-slate-300 rounded-xl px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button type="button" onclick="confirmarEdicaoMarcaCatalogo()" class="px-2.5 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold active:scale-95 shadow-xs">✓</button>
            <button type="button" onclick="cancelarEdicaoMarcaCatalogo()" class="px-2.5 py-1.5 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold active:scale-95 shadow-xs">✕</button>
          </div>

          <div id="boxCatalogMarcaConfirmDelete" class="hidden p-2.5 bg-rose-50/90 border border-rose-200 rounded-xl text-xs transition-all">
            <div class="flex items-start space-x-2 mb-2">
              <span class="text-rose-500 font-bold text-sm leading-none mt-0.5">⚠️</span>
              <div class="text-rose-900 leading-snug">
                <span>Deseja excluir a marca <strong id="labelCatalogMarcaParaExcluir" class="text-rose-700"></strong>?</span>
                <span class="block text-[11px] text-rose-600 mt-0.5">Todas as cotações dela serão apagadas deste produto.</span>
              </div>
            </div>
            <div class="flex justify-end items-center space-x-2">
              <button type="button" onclick="cancelarExclusaoMarcaCatalogo()" class="px-2.5 py-1 text-xs font-bold text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 rounded-lg transition-colors">Cancelar</button>
              <button type="button" onclick="executarExclusaoMarcaCatalogo()" class="px-3 py-1 text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-lg shadow-xs transition-colors">Excluir</button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1 border-t border-emerald-200/60">
            <div>
              <label class="block text-[10px] font-bold text-slate-600 uppercase mb-0.5">Supermercado</label>
              <select id="compareSelectMarket" class="w-full text-xs font-semibold bg-white border border-slate-300 rounded-lg p-1.5 focus:ring-emerald-500 cursor-pointer"></select>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-600 uppercase mb-0.5">Preço Unit. (R$)</label>
              <div class="flex items-center space-x-1">
                <input type="text" id="compareInputPrice" inputmode="decimal" placeholder="0,00" class="w-full text-xs font-bold bg-white border border-slate-300 rounded-lg p-1.5 text-slate-800 focus:ring-emerald-500">
                <button type="button" onclick="salvarPrecoComparativoModal()" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-xs rounded-lg shadow-xs transition-transform shrink-0" title="Gravar preço neste mercado">✓</button>
              </div>
            </div>
          </div>
        </div>

        <div class="border border-slate-200 rounded-2xl p-2.5 bg-slate-50/70">
          <div class="flex items-center justify-between cursor-pointer select-none" onclick="toggleComparativoRedesCatalogo()">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-black text-slate-700 uppercase tracking-wider">📊 Preços nas Redes</span>
              <span id="badgeContadorRedesCatalogo" class="text-[10px] font-black bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full border border-emerald-200">Redes</span>
            </div>
            <button type="button" id="btnToggleRedesCatalogo" class="text-xs font-bold text-emerald-700 hover:text-emerald-900 flex items-center space-x-1 py-0.5 px-2 rounded-lg hover:bg-emerald-100/60 transition-colors">
              <span id="labelToggleRedesCatalogo">Maximizar</span>
              <span id="arrowToggleRedesCatalogo">▼</span>
            </button>
          </div>
          <div id="containerTabelaRedesCatalogo" class="hidden mt-2 transition-all">
            <div id="comparePricesTable" class="space-y-1.5 max-h-48 overflow-y-auto pr-1"></div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-100">
        <button type="button" onclick="closeProductEditModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">Fechar</button>
        <button type="submit" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 active:scale-95 text-white font-bold text-xs rounded-xl shadow-sm transition-all">Salvar Produto</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL CADASTRAR / EDITAR SUPERMERCADO -->
<div id="modalMarketEdit" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 id="modalMarketEditTitle" class="font-extrabold text-slate-800 text-base">Supermercado</h3>
      <button type="button" onclick="closeMarketEditModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
    </div>

    <form id="formSaveMarket" class="space-y-3">
      <input type="hidden" id="editMarketId" value="" />
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Nome da Rede <span class="text-rose-500">*</span></label>
        <input type="text" id="editMarketName" required class="w-full text-xs font-semibold py-2.5 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Região / Bairro</label>
        <input type="text" id="editMarketBranch" class="w-full text-xs font-semibold py-2.5 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Endereço Completo</label>
        <input type="text" id="editMarketAddress" class="w-full text-xs font-semibold py-2.5 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Dia de Ofertas</label>
        <input type="text" id="editMarketPromoDay" class="w-full text-xs font-semibold py-2.5 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none" />
      </div>
      <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-100">
        <button type="button" onclick="closeMarketEditModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">Cancelar</button>
        <button type="submit" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 active:scale-95 text-white font-bold text-xs rounded-xl shadow-sm transition-all">Salvar Supermercado</button>
      </div>
    </form>
  </div>
</div>
