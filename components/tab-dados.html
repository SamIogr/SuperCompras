<div class="tab-dados-wrapper p-2 sm:p-4 space-y-4 pb-24">

  <!-- 1. SELETOR DE SUB-ABAS (PRODUTOS X SUPERMERCADOS) -->
  <div class="bg-slate-200/80 p-1 rounded-xl flex items-center gap-1 border border-slate-300 shadow-2xs">
    <button type="button" 
            id="btn-subtab-produtos" 
            onclick="setSubTabDados('produtos')" 
            class="flex-1 py-2 px-3 rounded-lg bg-white text-slate-800 shadow-xs text-center transition-all flex items-center justify-center space-x-1.5 font-bold text-xs cursor-pointer">
      <span>📦 Produtos (<span id="badge-total-produtos">0</span>)</span>
    </button>
    
    <button type="button" 
            id="btn-subtab-mercados" 
            onclick="setSubTabDados('mercados')" 
            class="flex-1 py-2 px-3 rounded-lg text-slate-600 hover:text-slate-800 text-center transition-all flex items-center justify-center space-x-1.5 font-semibold text-xs cursor-pointer">
      <span>🏢 Supermercados (<span id="badge-total-mercados">0</span>)</span>
    </button>
  </div>

  <!-- 2. SUB-ABA: CATÁLOGO DE PRODUTOS -->
  <section id="secao-catalogo-produtos" class="space-y-3">
    <div class="flex items-center justify-between">
      <div>
        <h3 class="font-extrabold text-sm text-slate-800">Catálogo Mestre de Produtos</h3>
        <p class="text-[11px] text-slate-500">Cotações por rede e marcas vinculadas</p>
      </div>
      <button type="button" 
              onclick="openProductEditModal(null)" 
              class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-xl text-xs font-bold transition-all flex items-center space-x-1 shadow-xs cursor-pointer">
        <span>+ Novo Produto</span>
      </button>
    </div>

    <!-- Busca e Ordenação -->
    <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs flex items-center gap-2 flex-wrap">
      <input type="text" 
             id="input-busca-produtos" 
             placeholder="Buscar por nome ou setor (ex: Acém, Feijão, Arroz)..." 
             oninput="filtrarProdutosCatalogo()" 
             class="flex-1 min-w-[180px] text-xs font-semibold px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500">

      <select id="select-ordenacao-produtos" 
              onchange="ordenarProdutosCatalogo()" 
              class="text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 shrink-0">
        <option value="az">🔤 Nome (A -> Z)</option>
        <option value="za">🔤 Nome (Z -> A)</option>
        <option value="setor">📂 Por Setor</option>
      </select>
    </div>

    <!-- Contêiner de Produtos -->
    <div id="lista-produtos" class="space-y-2 pt-1"></div>
  </section>

  <!-- 3. SUB-ABA: SUPERMERCADOS -->
  <section id="secao-catalogo-mercados" class="space-y-3 hidden">
    <div class="flex items-center justify-between">
      <div>
        <h3 class="font-extrabold text-sm text-slate-800">Supermercados Cadastrados</h3>
        <p class="text-[11px] text-slate-500">Redes disponíveis para cotação e compras</p>
      </div>
      <button type="button" 
              onclick="openMarketEditModal(null)" 
              class="px-3.5 py-2 bg-sky-600 hover:bg-sky-700 active:scale-95 text-white rounded-xl text-xs font-bold transition-all flex items-center space-x-1 shadow-xs cursor-pointer">
        <span>+ Novo Supermercado</span>
      </button>
    </div>

    <!-- Contêiner de Supermercados -->
    <div id="lista-supermercados" class="space-y-2 pt-1"></div>
  </section>

</div>
